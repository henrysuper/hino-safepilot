<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智慧車隊油耗派遣平台</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css?v=blue2">
</head>
<body>
<header>
  <h1>智慧車隊油耗派遣平台 <small>Fleet Fuel Dispatch Intelligence</small></h1>
  <nav role="tablist" aria-label="功能">
    <button type="button" role="tab" aria-selected="true" data-tab="dispatch">智慧派車與發派預測</button>
  </nav>
</header>
<p id="status" role="status" aria-live="polite"></p>

<main>
  <section id="tab-dispatch" class="tab" role="tabpanel">
    <h2 class="view-title">多站發派預測</h2>
    <p class="hint">規劃多站點配送路線，比較該車系「車 × 駕駛」組合，建議最省油的派法。</p>
    <div class="split">
      <form id="dispatch-form" class="panel">
        <h2>發派任務</h2>
        <label>示範任務 <select id="demo-task"></select></label>
        <ol id="stops" class="stops"></ol>
        <button type="button" id="add-stop">＋ 中途停靠</button>
        <label>日期 <input id="task-date" type="date" required></label>
        <label id="depart-row">出發時間 <input id="depart" type="time" value="08:00" required></label>
        <label class="inline"><input id="live" type="checkbox"> 現在出發（TDX 即時路況）</label>
        <fieldset><legend>車系（選了就開始比較駕駛）</legend><div id="series" class="series" role="group" aria-label="車系"></div></fieldset>
      </form>
      <div class="panel grow">
        <div id="map" role="img" aria-label="路線地圖"></div>
        <label class="inline"><input id="basemap" type="checkbox" checked> 顯示地圖底圖</label>
        <div class="legend"><span class="sw highway"></span>高速/快速 <span class="sw normal"></span>一般道路 <span class="sw city"></span>市區</div>
        <div id="dispatch-result"></div>
      </div>
    </div>

    <h2 class="view-title">智慧派車（單程 A→B）</h2>
    <p class="hint">選起點、終點與車系，系統比較該車系所有車，推薦最佳車輛並給出理由。以車況為主、油耗為輔。</p>
    <div class="split">
      <form id="smart-form" class="panel">
        <h2>單程推薦</h2>
        <label>起點圍籬 <select id="smart-origin"></select></label>
        <label>終點圍籬 <select id="smart-destination"></select></label>
        <label>日期 <input id="smart-date" type="date" required></label>
        <label id="smart-depart-row">出發時間 <input id="smart-depart" type="time" value="08:00" required></label>
        <label class="inline"><input id="smart-live" type="checkbox"> 現在出發（TDX 即時路況）</label>
        <fieldset><legend>駕駛類型（可多選；不分駕駛就留一般）</legend><div id="smart-drivers" class="series" role="group" aria-label="駕駛類型"></div></fieldset>
        <fieldset><legend>車系（選了就開始推薦）</legend><div id="smart-series" class="series" role="group" aria-label="車系"></div></fieldset>
      </form>
      <div class="panel grow">
        <div id="smart-map" role="img" aria-label="智慧路線地圖"></div>
        <label class="inline"><input id="smart-basemap" type="checkbox" checked> 顯示地圖底圖</label>
        <div class="legend"><span class="sw highway"></span>高速/快速 <span class="sw normal"></span>一般道路 <span class="sw city"></span>市區</div>
        <div id="smart-result"></div>
      </div>
    </div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="app.js?v=rb2"></script>
</body>
</html>
